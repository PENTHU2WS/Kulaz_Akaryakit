<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 90" width="100%" height="100%">
  <!-- KULAZ Official Logo Emblem from Poster -->
  <!-- K Icon Symbol with Orange Accent Swoosh -->
  <g id="kulaz-icon">
    <!-- Back Navy Bar -->
    <path d="M 12 15 L 26 15 L 26 75 L 12 75 Z" fill="#0C1929" />
    <!-- Top Orange Swoosh -->
    <path d="M 26 42 L 58 15 L 72 15 L 40 45 Z" fill="#E65100" />
    <!-- Bottom Navy Diagonal -->
    <path d="M 32 38 L 66 75 L 50 75 L 24 46 Z" fill="#0C1929" />
    <!-- Top Flame Wing Accent -->
    <path d="M 42 15 C 50 8 62 10 70 15 C 60 18 52 24 46 32 Z" fill="#FF9800" />
  </g>
  
  <!-- Text Block -->
  <g id="kulaz-text">
    <text x="82" y="44" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#0C1929" letter-spacing="1">KULAZ</text>
    <text x="82" y="62" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#E65100" letter-spacing="1.5">AKARYAKIT NAKLİYE</text>
    <text x="82" y="76" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.5">GÜVEN, HIZ VE ENERJİ</text>
  </g>
</svg>
